; ---------------------------------------------------------------------------
; Run 层驱动配置（本次接入）
;   GlobalDefaultGameMode：所有关卡默认使用 Run 层的薄驱动 GameMode，
;     它每帧调用 UACRunSubsystem::Tick —— 战斗内核与局内循环的逻辑时间唯一入口。
;     不引用任何项目资产，因此 Content 为空也能运行。
;   GameDefaultMap：项目 Content 目录目前为空（无自有 .umap）。
;     这里沿用引擎自带的空世界模板；待自建 L_Run / L_Battle 后改为：
;       GameDefaultMap=/Game/Maps/L_Run.L_Run
;     并按需增开：
;       EditorStartupMap=/Game/Maps/L_Run.L_Run
;       GameInstanceClass=/Game/Blueprints/BP_AutoChessGameInstance.BP_AutoChessGameInstance_C
;     （GameInstanceClass 只有在需要蓝图侧配置时才设置；C++ 侧的
;       UACRunSubsystem / UACBattleSubsystem / UACBattleContentLibrary 会自动创建。）
; ---------------------------------------------------------------------------
GlobalDefaultGameMode=/Script/AutoChess.ACRunGameMode
GameDefaultMap=/Engine/Maps/Templates/OpenWorld

